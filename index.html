<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sant to Skill – Level Quest</title>
<style>
 :root{--bg:#fff8ec;--bg-strong:#f3ead7;--card:#fffdf8;--card-strong:#ffffff;--ink:#17233b;--mut:#4b5a72;--pri:#f08a1c;--pri2:#174a91;--pri-soft:#eaf1fb;--ok:#08784f;--bad:#b42335;--line:#d8e0ed;--shadow:0 18px 45px rgba(23,54,100,.12);--glow-warm:rgba(245,151,43,.16);--glow-cool:rgba(53,153,193,.12);--top-glow:rgba(23,74,145,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d172e;--bg-strong:#141f3d;--card:rgba(18,27,47,.88);--card-strong:#17233f;--ink:#edf3ff;--mut:#a7b7d5;--pri:#ffb454;--pri2:#8fa9ff;--pri-soft:rgba(143,169,255,.12);--ok:#40d392;--bad:#ff7d8e;--line:#243455;--shadow:0 20px 48px rgba(15,23,42,.4)}}
:root[data-theme="dark"]{--bg:#0d172e;--bg-strong:#141f3d;--card:rgba(18,27,47,.88);--card-strong:#17233f;--ink:#edf3ff;--mut:#c0cbe0;--pri:#ffb454;--pri2:#a9beff;--pri-soft:rgba(143,169,255,.16);--ok:#40d392;--bad:#ff8796;--line:#354461;--shadow:0 20px 48px rgba(15,23,42,.4);--glow-warm:rgba(245,151,43,.11);--glow-cool:rgba(53,153,193,.09);--top-glow:rgba(23,74,145,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 8%,var(--glow-warm),transparent 34%),radial-gradient(circle at 92% 20%,var(--glow-cool),transparent 38%),linear-gradient(145deg,var(--bg),var(--bg-strong));color:var(--ink);font:16px/1.55 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;position:relative}
body::before{content:"";position:absolute;inset:0 0 auto 0;height:260px;background:linear-gradient(180deg,var(--top-glow),transparent);z-index:0;pointer-events:none}
#main{position:relative;z-index:1}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 120px;position:relative;z-index:1}
button,input{font:inherit}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(2rem,4vw,2.6rem);line-height:1.1;margin:.2em 0}
h2{font-size:1.2rem;line-height:1.3;margin:.3em 0}
.card,.hero-panel,.module-card,.dashboard-card,.status-box,.lesson-shell,.auth-shell{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.card{padding:18px;margin:14px 0}
.hero-panel{padding:18px 18px 14px;background:linear-gradient(135deg,#1d3d8a 0%,#2b56b8 48%,#233a7e 100%);color:#f3f7ff;border:1px solid rgba(255,255,255,.14);margin:14px 0;box-shadow:0 20px 45px rgba(27,51,124,.35)}
.hero-panel h1,.hero-panel p{color:#f5f8ff}
.hero-top,.hero-title,.section-header,.lesson-meta,.lesson-cta,.panel-row,.auth-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero-title{align-items:flex-start;margin:12px 0 10px}
.eyebrow{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#eaf3ff}
.ghost-button,.btn,.opt,.lv,.who,.lesson-card,.filter-chip,.secondary-action{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease}
.ghost-button,.btn,.opt,.lv,.who,.lesson-card,.secondary-action{cursor:pointer}
.ghost-button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;color:#fff;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font:inherit;font-weight:800;background:linear-gradient(135deg,var(--pri) 0%,#ffa95b 100%);color:#1d1400;cursor:pointer;margin-top:12px;box-shadow:0 12px 24px rgba(255,159,67,.25)}
.btn.alt,.secondary-action{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:hover,.opt:hover,.lv:hover,.lesson-card:hover,.who:hover,.secondary-action:hover{transform:translateY(-1px)}
.opt,.lv{display:block;width:100%;text-align:left;background:var(--card-strong);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;font:inherit;cursor:pointer}
.opt.good{border-color:var(--ok);background:linear-gradient(180deg,rgba(26,184,122,.12),rgba(26,184,122,.04))}
.opt.bad{border-color:var(--bad);background:linear-gradient(180deg,rgba(223,79,94,.12),rgba(223,79,94,.04))}
.lv{display:flex;gap:12px;align-items:center;padding:12px 14px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(245,248,255,.9));border:1px solid var(--line)}
.lv[disabled]{opacity:.52;cursor:not-allowed}
.lv .n{flex:none;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pri2),#5d7bf5);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 8px 16px rgba(43,78,216,.25)}
.lv small{color:var(--mut);display:block}.lv .st{margin-left:auto;white-space:nowrap;font-weight:700}
.tag{display:inline-block;background:var(--pri-soft);color:var(--pri2);font-weight:800;font-size:.74rem;border-radius:20px;padding:5px 10px;margin:0 6px 6px 0}
.steps{display:flex;gap:8px;font-size:.78rem;color:var(--mut);margin:8px 0 12px}
.steps span{flex:1;text-align:center;padding:6px 6px;border-radius:10px;background:var(--line);font-weight:700}
.steps .on{background:linear-gradient(135deg,var(--pri),#ffb866);color:#1d1400}
.vl{border-left:4px solid var(--pri);padding:10px 12px;margin:12px 0;background:linear-gradient(135deg,rgba(255,159,67,.08),rgba(43,78,216,.04));border-radius:12px}
.vl .mr{font-size:1.3rem;font-weight:800;line-height:1.3}.vl .en{color:var(--mut);font-size:.95rem}
.box{background:linear-gradient(135deg,rgba(43,78,216,.08),rgba(255,159,67,.04));border:1px solid rgba(43,78,216,.08);border-radius:16px;padding:12px 14px;margin-top:12px}
.big{font-size:3rem;text-align:center;margin:8px 0}
.bar{height:10px;background:rgba(143,169,255,.18);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#ffca75);border-radius:inherit;transition:width .3s ease}
.back{background:none;border:0;color:var(--pri2);font:inherit;font-weight:800;cursor:pointer;padding:4px 0}
.foot{text-align:center;color:var(--mut);font-size:.82rem;margin:18px 0 0}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}.lang button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:.82rem;cursor:pointer}.lang button.on{background:linear-gradient(135deg,var(--pri),#ffb866);color:#1d1400;border-color:transparent;font-weight:800}
.lr{display:flex;justify-content:flex-end;margin-bottom:8px}
.lp{display:flex;flex-direction:column;align-items:center;width:96px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px;box-shadow:var(--shadow)}
.lp button{border:0;background:none;color:var(--pri2);font-size:.8rem;cursor:pointer;line-height:1;padding:4px 14px;font-weight:700}
.lw{height:34px;overflow:hidden;width:100%}.li{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.li div{height:34px;line-height:34px;text-align:center;font-weight:700;font-size:.9rem}
.ub{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:2px 0}
.who{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:5px 14px 5px 5px;font:inherit;cursor:pointer;text-align:left;box-shadow:0 10px 20px rgba(12,26,60,.16)}
.who small{display:block;color:#ffd36b;font-weight:600}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid #ffd36b;background:linear-gradient(135deg,#2d5ee6,#1b3f8f);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none}
.av.big{width:110px;height:110px;margin:0 auto 12px;font-size:2.6rem}
.in{display:block;width:100%;padding:13px 14px;margin:8px 0;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.in:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(255,159,67,.18)}
.otpi{text-align:center;font-size:1.6rem;letter-spacing:.5em}.otp{font-size:1.7rem;font-weight:800;letter-spacing:.3em;text-align:center;color:var(--pri2)}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin:4px 0}
.tabs{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:800;background:none;color:var(--ink);cursor:pointer}
.tabs .on{background:linear-gradient(135deg,var(--pri),#ffb866);color:#1d1400}
.avw{display:block;text-align:center;cursor:pointer;margin-bottom:6px}.avw small{display:block;color:var(--mut)}
.sec{font-size:.8rem;color:var(--mut);margin:10px 0 0}
.stage{height:78vh;display:grid;place-items:center;align-content:center;perspective:1000px;text-align:center;color:var(--ink)}
.book{position:relative;width:150px;height:200px;transform-style:preserve-3d;transform:rotateX(60deg) rotateZ(-25deg);animation:tilt 3s ease-in-out forwards}
@keyframes tilt{to{transform:rotateX(38deg) rotateZ(0deg) translateY(20px)}}
.cover,.pg{position:absolute;inset:0;transform-origin:left center;border-radius:4px 10px 10px 4px}
.pg{background:#fff8e4;border:1px solid #e6d3a3}
.cover{background:linear-gradient(135deg,#1b3f8f,#2c5fd0);border:3px solid #ffd36b;display:grid;place-items:center;color:#ffd36b;font-size:2.6rem;font-weight:800;animation:op 1.8s .5s ease-in-out forwards;box-shadow:6px 8px 20px rgba(0,0,0,.35)}
.p2{animation:op2 1.8s .8s ease-in-out forwards}
@keyframes op{to{transform:rotateY(-170deg)}}@keyframes op2{to{transform:rotateY(-155deg)}}
.flm{position:absolute;left:55px;top:60px;width:42px;height:64px;background:radial-gradient(ellipse at 50% 72%,#fff6b8,#ffb01f 45%,#f08a1c 70%,transparent 72%);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;opacity:0;animation:rise 1.5s 1.7s ease-out forwards,fl .25s 1.7s infinite alternate;filter:drop-shadow(0 0 14px #ffb01f)}
@keyframes rise{from{opacity:0;transform:translateZ(0)}to{opacity:1;transform:translateZ(120px)}}
@keyframes fl{from{transform:translateY(0) scale(1)}to{transform:translateY(-8px) scale(1.06)}}
.app-shell{display:grid;gap:14px}
.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat-card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:12px 14px;color:#edf4ff;display:flex;flex-direction:column;gap:4px}
.stat-card small{color:rgba(237,244,255,.72);font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.stat-card strong{font-size:1.4rem;line-height:1.2}
.stat-card span{font-size:.85rem;color:rgba(237,244,255,.75)}
.dashboard-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:14px}
.dashboard-card{padding:18px}
.section-header{margin-bottom:12px}
.section-header h2{margin:0}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 10px;background:var(--pri-soft);color:var(--pri2);font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.lesson-card{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:18px;background:var(--card-strong);border:1px solid var(--line);text-align:left;color:var(--ink)}
.lesson-card.locked{opacity:1;background:#f0f3f9}
.lesson-index{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri2),#5d7bf5);color:#fff;font-weight:800;box-shadow:0 8px 16px rgba(43,78,216,.22)}
.lesson-card.locked .lesson-index{background:linear-gradient(135deg,#a9b8d6,#8798bb)}
.lesson-copy{flex:1;min-width:0}
.lesson-copy h3{margin:0 0 4px;font-size:1rem;line-height:1.35}
.lesson-copy p{margin:0;color:var(--mut);font-size:.85rem}
.lesson-score{font-size:.8rem;font-weight:800;color:var(--pri2)}
.lesson-card.locked .lesson-score{color:var(--mut)}
.status-box{padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(38,71,163,.08),rgba(255,159,67,.07));border:1px solid rgba(43,78,216,.08)}
.status-box strong{display:block;font-size:1.35rem;margin:4px 0 0}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badge{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:999px;border:1px solid rgba(43,78,216,.12);background:rgba(255,255,255,.7);font-size:.76rem;font-weight:700}
.lesson-shell{padding:18px;margin-top:14px;display:grid;gap:12px}
.lesson-hero{background:linear-gradient(135deg,var(--card-strong),var(--card));border:1px solid var(--line);border-radius:20px;padding:16px}
.lesson-hero h2{margin:8px 0 0;font-size:1.45rem}
.lesson-hero p{margin:8px 0 0;color:var(--mut);font-weight:600}
.lesson-cta{margin-top:4px}
.secondary-action{padding:10px 16px;border-radius:12px;font-weight:800;background:var(--card-strong)}
@media (max-width:620px){.dashboard-grid,.stats-grid{grid-template-columns:1fr}.hero-top,.hero-title,.section-header,.lesson-meta,.lesson-cta{flex-direction:column;align-items:flex-start}.wrap{padding-left:12px;padding-right:12px}.card,.dashboard-card,.hero-panel,.lesson-shell{border-radius:18px}}}
@keyframes fl{to{scale:1.08 .94}}
.it{margin:60px 0 0;color:var(--pri2);opacity:0;animation:fade 1s 2s forwards}.it2{color:var(--mut);opacity:0;animation:fade 1s 2.6s forwards}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

.scene-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;perspective:1200px;opacity:.72}
.scene-glow{position:absolute;width:min(64vw,760px);aspect-ratio:1;border-radius:50%;right:-15vw;top:-28vw;background:radial-gradient(circle,rgba(255,190,99,.28),rgba(101,139,255,.14) 42%,transparent 72%);filter:blur(10px);animation:glow-drift 12s ease-in-out infinite alternate}
.scene-art{position:absolute;width:min(47vw,560px);height:auto;right:1.5vw;top:8vh;overflow:visible;filter:drop-shadow(0 28px 50px rgba(11,30,81,.3));transform-style:preserve-3d;animation:saint-float 8s ease-in-out infinite}
.scene-art .saint-body{transform-origin:50% 50%;animation:saint-turn 12s ease-in-out infinite}
.scene-art .halo{transform-origin:250px 190px;animation:halo-pulse 5s ease-in-out infinite}
.scene-art .floating-book{transform-origin:250px 475px;animation:book-hover 7s ease-in-out infinite}
.scene-art .sparkle{transform-box:fill-box;transform-origin:center;animation:sparkle 3.8s ease-in-out infinite alternate}
.scene-art .sparkle:nth-of-type(2){animation-delay:1.1s}.scene-art .sparkle:nth-of-type(3){animation-delay:2s}
@keyframes saint-float{0%,100%{transform:translate3d(0,0,0) rotateY(-7deg) rotateX(2deg)}50%{transform:translate3d(0,-14px,18px) rotateY(5deg) rotateX(-1deg)}}
@keyframes glow-drift{from{transform:translate3d(-3%,0,0) scale(.95)}to{transform:translate3d(3%,5%,0) scale(1.08)}}
@keyframes saint-turn{0%,100%{transform:rotateY(-2deg)}50%{transform:rotateY(3deg)}}
@keyframes halo-pulse{0%,100%{opacity:.78;transform:scale(.98)}50%{opacity:1;transform:scale(1.035)}}
@keyframes book-hover{0%,100%{transform:translateY(0) rotateX(0)}50%{transform:translateY(-8px) rotateX(4deg)}}
@keyframes sparkle{from{opacity:.35;transform:scale(.75) rotate(-12deg)}to{opacity:1;transform:scale(1.12) rotate(12deg)}}
body[data-screen="auth"] .scene-bg{opacity:.88}
body[data-screen="auth"] .scene-art{width:min(49vw,600px);right:0;top:8vh;opacity:.78}
body[data-screen="auth"] .card{background:rgba(255,255,255,.82);backdrop-filter:blur(22px)}
body[data-screen="home"] .scene-bg{opacity:.58}
body[data-screen="home"] .scene-art{width:min(38vw,450px);right:0;top:15vh;opacity:.7}
body[data-screen="home"] .hero-panel,body[data-screen="home"] .dashboard-card{backdrop-filter:blur(18px)}
body[data-screen="lesson"] .scene-bg{opacity:.2}
body[data-screen="profile"] .scene-bg,body[data-screen="otp"] .scene-bg{opacity:.5}
.auth-intro{max-width:640px;margin:0 auto 14px;padding:10px 8px 2px;color:#fff;position:relative}
.auth-intro h1{font-size:clamp(2rem,5vw,2.8rem);text-shadow:0 6px 24px rgba(8,20,62,.24)}
.auth-intro p{max-width:500px;color:rgba(255,255,255,.82);margin:8px 0 0}
.card,.dashboard-card,.lesson-shell{background:var(--card-strong)}
.vl .mr{font-size:1.4rem;line-height:1.55;color:var(--ink)}
.vl .en{font-size:1.06rem;line-height:1.6;color:var(--ink)}
.scene-art{pointer-events:none}
.library-intro{margin:0 0 14px;color:var(--mut);font-size:1rem;line-height:1.65}
.library-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.library-tab{flex:0 0 auto;min-height:44px;border:1px solid var(--line);border-radius:999px;padding:9px 15px;background:var(--card-strong);color:var(--ink);font-weight:800;cursor:pointer}
.library-tab[aria-selected="true"]{background:var(--pri2);border-color:var(--pri2);color:#fff;box-shadow:0 8px 18px rgba(43,78,216,.2)}
.library-group-label{font-size:.8rem;font-weight:800;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin:8px 0 4px}
.library-level{margin:14px 0;padding:16px;background:var(--card-strong);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}

.library-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.verse-pair{display:block;width:100%;text-align:left;margin:10px 0;padding:15px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.verse-pair:hover,.verse-pair:focus-visible{border-color:var(--pri2);outline:3px solid rgba(43,78,216,.16)}
.verse-pair .verse-text{display:block;font-size:1.28rem;font-weight:800;line-height:1.65}
.verse-pair .meaning-text{display:block;margin-top:6px;color:var(--ink);font-size:1rem;line-height:1.65}

.speech-controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.speech-controls .secondary-action{min-height:44px}
.speech-status{min-height:1.6em;padding:8px 10px;border-radius:10px;background:var(--pri-soft);color:var(--ink);font-size:.92rem;font-weight:700}
.speech-status:empty{display:none}
body[data-screen="auth"] .card{background:var(--card-strong)}
body[data-screen="auth"] .in{background:var(--card-strong);color:var(--ink)}
body[data-screen="auth"] .sec{color:var(--ink);font-size:.95rem;line-height:1.65}
.auth-intro p{color:#fff;text-shadow:0 1px 4px rgba(9,20,55,.55)}
.scene-bg{opacity:.18}
.scene-glow{opacity:.45}
body[data-screen="auth"] .scene-bg,body[data-screen="home"] .scene-bg,body[data-screen="library"] .scene-bg,body[data-screen="lesson"] .scene-bg,body[data-screen="profile"] .scene-bg,body[data-screen="otp"] .scene-bg{opacity:.2}
body[data-screen="auth"] .scene-art,body[data-screen="home"] .scene-art,body[data-screen="library"] .scene-art,body[data-screen="lesson"] .scene-art,body[data-screen="profile"] .scene-art,body[data-screen="otp"] .scene-art{opacity:.16}
body[data-screen="auth"] .scene-glow,body[data-screen="home"] .scene-glow,body[data-screen="library"] .scene-glow,body[data-screen="lesson"] .scene-glow,body[data-screen="profile"] .scene-glow,body[data-screen="otp"] .scene-glow{opacity:.3}
.card,.dashboard-card,.lesson-shell,.library-level{background:var(--card-strong);backdrop-filter:none}
.dashboard-card,.status-box,.library-level{color:var(--ink)}
.stat-card{background:rgba(7,19,50,.3);border-color:rgba(255,255,255,.32)}
.stat-card small,.stat-card span{color:#f4f7ff;font-size:.86rem}
.hero-panel p,.hero-panel h1{color:#fff}
.eyebrow{color:#fff;background:rgba(4,14,40,.32);border-color:rgba(255,255,255,.4)}
.pill,.tag{color:#173aa9;background:#e5ecff}
.steps{font-size:.9rem;color:var(--ink)}
.steps span{background:#e1e8f5;color:#23334f}
.steps .on{background:#ffb866;color:#291800}

const D=[[0,0,"⚖️",["बोले तैसा चाले","त्याची वंदावी पाउले"]],[0,0,"💛",["जे का रंजले गांजले","त्यासी म्हणे जो आपुले","तोचि साधू ओळखावा","देव तेथेचि जाणावा"]],[1,1,"🌧️",["जनी सर्वसुखी असा कोण आहे","विचारी मना तूंचि शोधूनि पाहें"]],[2,2,"🧘",["जे खळांची व्यंकटी सांडो","तयां सत्कर्मी रती वाढो","भूतां परस्परें पडो","मैत्र जीवाचें"]],[1,1,"🚩",["केल्याने होत आहे रे","आधी केलेचि पाहिजे"]],[2,2,"🏘️",["दुरितांचे तिमिर जावो","विश्व स्वधर्म सूर्यें पाहो","जो जे वांछिल तो तें लाहो","प्राणिजात"]]];

const X={
en:[
["Integrity",["One who acts exactly as they speak","deserves our deepest respect"],"Words are cheap; actions prove character. Be a person whose promises can be trusted.","What is the main teaching of this abhang?",["Speak sweetly so people like you","Match your actions to your words","Always bow to older people"],"Right! Respect comes from walking the talk.","You promised to return your friend’s notes by Monday, but you’d rather go out.",[["Return them on time, as promised.","Keeping a small promise builds big trust."],["Promise again for next week.","Delays break trust bit by bit."],["Say you never promised.","This is the opposite of ‘bole taisa chale’."]],["Keep one small promise every day.","Before saying yes, ask: can I truly do this?","Say sorry quickly when I miss a promise."]],
["Empathy",["Those who are hurt and troubled","the one who calls them his own","is to be known as a true saint","God is found right there"],"Real goodness is helping people in pain as if they were your own family.","According to this abhang, who is a true saint?",["One who lives far from people","One who treats suffering people as their own","One who knows many languages"],"Yes! Compassion in action is the real test.","A classmate is being teased because he can’t afford the school kit.",[["Sit beside him, include him, and tell the teasers to stop.","You treated him as your own. That’s empathy."],["Laugh along so you aren’t targeted.","Joining in adds to his pain."],["Look away; not your problem.","Silence can hurt too."]],["Ask one person every day: how are you really?","Share something (lunch, notes) with someone who needs it.","Stand up when someone is teased."]],
["Resilience",["Who in this world is completely happy?","O mind, think and find out for yourself"],"Everyone has troubles. Don’t envy others; face your own problems calmly and keep going.","What does this shlok want us to realise?",["Rich people have no problems","No one is free from troubles, so face yours with strength","Never ask for help"],"Correct! Knowing this reduces envy and builds strength.","Your friend made the team and you didn’t. You feel jealous.",[["Congratulate them, remember everyone struggles, and plan your own practice.","That is resilience: turn jealousy into effort."],["Stop talking to them.","Envy damages friendship."],["Quit the sport.","One setback isn’t the end."]],["When I feel envy, write one thing I can improve.","Each night, note one thing I overcame today.","Congratulate someone sincerely today."]],
["Emotional Intelligence",["May the crookedness of the wicked fall away","may they grow fond of good deeds","may all living beings","be bound by friendship of the heart"],"Instead of hating those who hurt us, wish for them to change. A calm, kind mind is strong.","What does Dnyaneshwar wish even for wicked people?",["That they are punished","That they turn towards good deeds, and all beings live in friendship","That they stay away forever"],"Right! Wishing good for all is emotional maturity.","A classmate spread a rumour about you. Now he’s alone and stressed before exams.",[["Calmly tell him it hurt, and offer help if he asks.","You stayed in control and kept the door open to friendship."],["Spread a rumour about him.","Revenge keeps the hurt alive."],["Celebrate his trouble.","It feeds anger, not peace."]],["Pause for 5 slow breaths before replying in anger.","Say what hurt me, without insults.","Forgive one small thing today."]],
["Leadership",["Things happen by doing","but first you must do it yourself"],"Don’t wait for perfect conditions. Start; others will follow your lead.","What is the message of this shlok?",["Wait for the right time","Take the first step yourself","Let others start first"],"Yes! Action first, results follow.","You want to start a reading club but keep waiting for someone to join first.",[["Start this week: pick one book and invite two friends.","Small first steps create leaders."],["Wait till 20 people sign up.","Waiting means nothing starts."],["Drop the idea.","Ideas need action."]],["Start one tiny good habit this week.","Volunteer for one task in class or home.","Invite one friend to join me."]],
["Teamwork",["May the darkness of wrong fade away","may the world see by the sun of its own duty","may everyone get what they rightly wish","all living beings"],"A good team wants every person to shine. Success is shared, not owned by one.","Which idea fits this ovi best?",["Only the strongest should succeed","Everyone should be able to grow and succeed in their own way","Work alone to avoid conflict"],"Exactly! That is the spirit of teamwork.","In your group project one teammate draws well, another writes well.",[["Divide tasks by strengths so everyone shines.","Everyone gets to do their best."],["Do everything yourself.","You burn out and they don’t grow."],["Give the easy parts to friends only.","That’s unfair, and the project suffers."]],["Give credit to a teammate out loud.","Ask: what’s your strength? before dividing work.","Offer help before being asked."]]],
mr:[
["प्रामाणिकपणा",["जो जसा बोलतो तसाच वागतो","त्याच्या चरणी वंदन करावे (तो आदरास पात्र आहे)"],"शब्द स्वस्त असतात; कृतीतून चारित्र्य दिसते. असा माणूस व्हा ज्याच्या वचनावर विश्वास ठेवता येईल.","या अभंगाची मुख्य शिकवण काय?",["लोकांना आवडावे म्हणून गोड बोलावे","आपल्या वागण्याचा आणि बोलण्याचा मेळ ठेवावा","मोठ्यांना नेहमी वाकून नमस्कार करावा"],"बरोबर! बोलण्याप्रमाणे वागण्यातूनच आदर मिळतो.","तुम्ही मित्राला सोमवारी वह्या परत द्यायचे वचन दिले, पण आता तुम्हाला फिरायला जावेसे वाटते.",[["ठरल्याप्रमाणे वेळेवर वह्या परत करा.","लहान वचन पाळल्याने मोठा विश्वास निर्माण होतो."],["पुढच्या आठवड्याचे पुन्हा वचन द्या.","उशिरामुळे विश्वास हळूहळू तुटतो."],["तुम्ही वचन दिलेच नाही असे सांगा.","हे ‘बोले तैसा चाले’च्या अगदी उलट आहे."]],["रोज एक लहानसे वचन पाळा.","होकार देण्याआधी विचारा: हे मला खरोखर जमेल का?","वचन मोडल्यास लगेच माफी मागा."]],
["सहानुभूती",["जे दुःखी, पीडित आहेत","त्यांना जो आपले म्हणतो","तोच खरा साधू ओळखावा","देव तेथेच आहे असे जाणावे"],"खरा चांगुलपणा म्हणजे दुःखी माणसांना आपल्याच कुटुंबातील समजून मदत करणे.","या अभंगानुसार खरा साधू कोण?",["जो माणसांपासून दूर राहतो","जो दुःखी लोकांना आपले मानतो","ज्याला अनेक भाषा येतात"],"होय! कृतीतील करुणा हीच खरी कसोटी आहे.","शाळेचे साहित्य परवडत नाही म्हणून एका वर्गमित्राची चेष्टा केली जात आहे.",[["त्याच्या शेजारी बसा, त्याला सोबत घ्या आणि चेष्टा करणाऱ्यांना थांबवा.","तुम्ही त्याला आपले मानले. हीच सहानुभूती."],["टार्गेट होऊ नये म्हणून हसण्यात सामील व्हा.","हसल्याने त्याचे दुःख वाढते."],["दुर्लक्ष करा; माझा काय संबंध?","गप्प राहणेही दुखावते."]],["रोज एकाला विचारा: खरंच कसा आहेस?","गरज असलेल्याबरोबर डबा किंवा वह्या वाटून घ्या.","कोणाची चेष्टा होत असेल तर पुढे व्हा."]],
["चिकाटी",["या जगात पूर्ण सुखी कोण आहे?","अरे मना, तूच विचार करून शोधून पाहा"],"प्रत्येकाला अडचणी असतात. इतरांचा हेवा करू नका; आपल्या अडचणींना शांतपणे तोंड देत पुढे चालत राहा.","हा श्लोक आपल्याला काय जाणवून देतो?",["श्रीमंतांना कोणतीही अडचण नसते","कोणीही संकटांपासून मुक्त नाही, म्हणून आपल्या संकटांना धैर्याने सामोरे जावे","कधीही मदत मागू नये"],"बरोबर! हे जाणल्याने हेवा कमी होतो आणि बळ वाढते.","तुमचा मित्र संघात निवडला गेला, तुम्ही नाही. तुम्हाला हेवा वाटतो.",[["त्याचे अभिनंदन करा, प्रत्येकाला संघर्ष असतो हे लक्षात ठेवा आणि स्वतःचा सराव ठरवा.","हीच चिकाटी: हेव्याचे रूपांतर प्रयत्नांत."],["त्याच्याशी बोलणे बंद करा.","हेव्याने मैत्री बिघडते."],["तो खेळच सोडून द्या.","एका अपयशाने सगळे संपत नाही."]],["हेवा वाटला तर स्वतःतील एक सुधारणा लिहीन.","रोज रात्री आज मी कशावर मात केली ते लिहीन.","आज कोणाचे तरी मनापासून अभिनंदन करीन."]],
["भावनिक बुद्धिमत्ता",["खळांची वक्रता नाहीशी होवो","त्यांना सत्कर्मांची आवड वाढो","सर्व प्राणिमात्रांमध्ये","जिवाभावाची मैत्री निर्माण होवो"],"आपल्याला दुखावणाऱ्यांचा द्वेष करण्याऐवजी त्यांनी बदलावे अशी इच्छा करा. शांत, दयाळू मन हेच खरे बळ आहे.","ज्ञानेश्वर दुष्ट लोकांसाठीही काय इच्छितात?",["त्यांना शिक्षा व्हावी","त्यांनी चांगल्या कर्मांकडे वळावे आणि सर्वांमध्ये मैत्री नांदावी","त्यांनी कायम दूर राहावे"],"बरोबर! सर्वांचे भले चिंतणे हीच भावनिक परिपक्वता.","एका वर्गमित्राने तुमच्याबद्दल अफवा पसरवली. आता परीक्षेआधी तो एकटा आणि तणावात आहे.",[["शांतपणे सांगा की तुम्हाला दुःख झाले, आणि त्याने मागितली तर मदत करा.","तुम्ही संयम राखला आणि मैत्रीचे दार उघडे ठेवले."],["त्याच्याबद्दल अफवा पसरवा.","सूडाने दुःख जिवंत राहते."],["त्याच्या अडचणीचा आनंद साजरा करा.","यामुळे राग वाढतो, शांती नाही."]],["रागात उत्तर देण्याआधी ५ दीर्घ श्वास घेईन.","अपमान न करता मला काय दुखावले ते सांगेन.","आज एखादी लहान चूक माफ करीन."]],
["नेतृत्व",["करण्याने होते आहे","पण आधी स्वतःच केले पाहिजे"],"परिपूर्ण परिस्थितीची वाट पाहू नका. सुरुवात करा; इतर तुमच्या मागे येतील.","या श्लोकाचा संदेश काय?",["योग्य वेळेची वाट पाहावी","स्वतः पहिले पाऊल उचलावे","इतरांनी आधी सुरुवात करावी"],"होय! आधी कृती, मग फळ.","तुम्हाला वाचन मंडळ सुरू करायचे आहे, पण कोणीतरी आधी सामील होईल याची तुम्ही वाट पाहता.",[["या आठवड्यात सुरू करा: एक पुस्तक निवडा आणि दोन मित्रांना बोलवा.","लहान पहिली पावले नेते घडवतात."],["२० जण नोंदवतील तोपर्यंत थांबा.","वाट पाहिल्याने काहीच सुरू होत नाही."],["कल्पना सोडून द्या.","कल्पनांना कृतीची गरज असते."]],["या आठवड्यात एक लहान चांगली सवय सुरू करीन.","वर्गात किंवा घरी एक जबाबदारी स्वतःहून घेईन.","एका मित्राला सोबत येण्यास सांगेन."]],
["सांघिक कार्य",["पापांचा अंधार नाहीसा होवो","विश्वाने स्वधर्मरूपी सूर्याच्या प्रकाशात पाहावे","ज्याला जे योग्य हवे ते त्याला मिळो","सर्व प्राणिमात्र"],"चांगला संघ प्रत्येकाने चमकावे असे इच्छितो. यश वाटून घ्यायचे असते, एकट्याचे नसते.","कोणती कल्पना या ओवीशी सर्वात जुळते?",["फक्त सर्वात बलवानाने यशस्वी व्हावे","प्रत्येकाला आपल्या पद्धतीने वाढता आणि यशस्वी होता यावे","संघर्ष टाळण्यासाठी एकट्याने काम करावे"],"अगदी बरोबर! हाच सांघिक कार्याचा आत्मा.","तुमच्या गट-प्रकल्पात एका सहकाऱ्याला चित्रे छान काढता येतात, दुसऱ्याला लिहिता येते.",[["कामे क्षमतेनुसार वाटा म्हणजे प्रत्येकजण चमकेल.","प्रत्येकाला आपले सर्वोत्तम देता येते."],["सर्व काही स्वतः करा.","तुम्ही थकता आणि बाकीचे शिकत नाहीत."],["सोपी कामे फक्त मित्रांना द्या.","हे अन्यायकारक आहे आणि प्रकल्प बिघडतो."]],["सर्वांसमोर सहकाऱ्याला श्रेय देईन.","काम वाटण्याआधी विचारेन: तुझी ताकद काय?","न मागता मदतीचा हात देईन."]]],
hi:[
["ईमानदारी",["जो जैसा बोलता है वैसा ही करता है","उसके चरणों में वंदन करना चाहिए (वह सम्मान के योग्य है)"],"शब्द सस्ते होते हैं; कर्म से चरित्र पता चलता है। ऐसे इंसान बनें जिसके वादे पर भरोसा किया जा सके।","इस अभंग की मुख्य सीख क्या है?",["लोगों को खुश करने के लिए मीठा बोलना","अपने कर्म और वचन में मेल रखना","बड़ों को हमेशा झुककर प्रणाम करना"],"सही! कथनी और करनी एक होने से सम्मान मिलता है।","आपने दोस्त से सोमवार तक नोट्स लौटाने का वादा किया था, पर अब आप घूमने जाना चाहते हैं।",[["वादे के अनुसार समय पर नोट्स लौटाएँ।","छोटा वादा निभाने से बड़ा भरोसा बनता है।"],["अगले हफ़्ते का नया वादा कर दें।","देरी से भरोसा धीरे-धीरे टूटता है।"],["कह दें कि आपने कोई वादा ही नहीं किया था।","यह ‘बोले तैसा चाले’ के बिल्कुल उलट है।"]],["रोज़ एक छोटा वादा निभाऊँगा।","हाँ कहने से पहले सोचूँगा: क्या मैं यह सच में कर सकता हूँ?","वादा टूटे तो तुरंत माफ़ी माँगूँगा।"]],
["सहानुभूति",["जो दुखी और पीड़ित हैं","उन्हें जो अपना कहता है","वही सच्चा साधु पहचानना चाहिए","वहीं ईश्वर का वास जानो"],"सच्ची अच्छाई है दुखी लोगों की अपने परिवार की तरह मदद करना।","इस अभंग के अनुसार सच्चा साधु कौन है?",["जो लोगों से दूर रहता है","जो पीड़ित लोगों को अपना मानता है","जिसे कई भाषाएँ आती हैं"],"हाँ! कर्म में करुणा ही असली कसौटी है।","स्कूल का सामान न खरीद पाने की वजह से एक सहपाठी का मज़ाक उड़ाया जा रहा है।",[["उसके पास बैठें, उसे साथ लें और मज़ाक उड़ाने वालों को रोकें।","आपने उसे अपना माना। यही सहानुभूति है।"],["निशाना न बनने के लिए हँसी में शामिल हो जाएँ।","साथ हँसने से उसका दर्द बढ़ता है।"],["नज़रअंदाज़ करें; मुझे क्या?","चुप रहना भी चोट पहुँचाता है।"]],["रोज़ एक व्यक्ति से पूछूँगा: सच में कैसे हो?","ज़रूरतमंद के साथ अपना खाना या नोट्स बाँटूँगा।","किसी का मज़ाक उड़े तो उसके पक्ष में खड़ा होऊँगा।"]],
["लचीलापन",["इस संसार में पूरी तरह सुखी कौन है?","हे मन, तू ही सोचकर खोजकर देख"],"हर किसी को परेशानियाँ होती हैं। दूसरों से ईर्ष्या न करें; अपनी समस्याओं का शांति से सामना करें और आगे बढ़ते रहें।","यह श्लोक हमें क्या समझाता है?",["अमीरों को कोई समस्या नहीं होती","कोई भी कठिनाइयों से मुक्त नहीं, इसलिए अपनी कठिनाइयों का साहस से सामना करें","कभी मदद नहीं माँगनी चाहिए"],"सही! यह समझने से ईर्ष्या घटती है और शक्ति बढ़ती है।","आपका दोस्त टीम में चुना गया, आप नहीं। आपको जलन हो रही है।",[["उसे बधाई दें, याद रखें कि सबका संघर्ष होता है, और अपना अभ्यास तय करें।","यही लचीलापन है: जलन को मेहनत में बदलना।"],["उससे बात करना बंद कर दें।","ईर्ष्या दोस्ती बिगाड़ती है।"],["वह खेल ही छोड़ दें।","एक असफलता का मतलब अंत नहीं है।"]],["जलन हो तो अपनी एक सुधार-योग्य बात लिखूँगा।","हर रात लिखूँगा कि आज मैंने किस चुनौती को पार किया।","आज किसी को सच्चे मन से बधाई दूँगा।"]],

const themeRoot=document.documentElement;
function themeRgb(color){return color.match(/[0-9a-f]{2}/gi).map(part=>parseInt(part,16))}
function themeHex(rgb){return "#"+rgb.map(channel=>Math.round(Math.max(0,Math.min(255,channel))).toString(16).padStart(2,"0")).join("")}
function themeMix(first,second,amount){const a=themeRgb(first),b=themeRgb(second);return themeHex(a.map((channel,index)=>channel+(b[index]-channel)*amount))}
function themeLuminance(color){return themeRgb(color).map(channel=>channel/255).map(channel=>channel<=.04045?channel/12.92:((channel+.055)/1.055)**2.4).reduce((sum,channel,index)=>sum+channel*[.2126,.7152,.0722][index],0)}
function themeContrast(first,second){const values=[themeLuminance(first),themeLuminance(second)].sort((a,b)=>b-a);return(values[0]+.05)/(values[1]+.05)}
function themeText(color){return themeContrast(color,"#111827")>=themeContrast(color,"#ffffff")?"#111827":"#ffffff"}
function accessibleAccent(color,surface){const target=themeContrast("#111827",surface)>=themeContrast("#ffffff",surface)?"#111827":"#ffffff";let result=color,amount=.05;while(themeContrast(result,surface)<4.5&&amount<=1){result=themeMix(color,target,amount);amount+=.05}return result}

  const values={"--bg":themeBackground,"--bg-strong":themeMix(themeBackground,isDark?"#ffffff":"#000000",.1),"--card":card,"--card-strong":cardStrong,"--ink":ink,"--mut":themeMix(ink,cardStrong,isDark ? .24 : .34),"--pri":"#f08a1c","--pri2":accent,"--pri-soft":themeMix(accent,cardStrong,.96),"--ok":isDark?"#53d6a0":"#08784f","--bad":isDark?"#ff8796":"#b42335","--line":themeMix(ink,cardStrong,.18),"--shadow":isDark?"0 20px 48px rgba(0,0,0,.38)":"0 18px 45px rgba(23,54,100,.14)","--glow-warm":isDark?"rgba(245,151,43,.1)":"rgba(245,151,43,.16)","--glow-cool":isDark?"rgba(53,153,193,.08)":"rgba(53,153,193,.12)","--top-glow":isDark?"rgba(23,74,145,.12)":"rgba(23,74,145,.08)","--selected-text":themeText(accent)};
  Object.entries(values).forEach(([property,value])=>themeRoot.style.setProperty(property,value));

}
